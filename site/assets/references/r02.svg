<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" role="img" aria-labelledby="title desc">
<title id="title">Support beneath a surface</title>
<desc id="desc">Shale beneath sandstone erodes, removing support so sandstone can break away. This conceptual diagram gives no measured local thickness, age or exact geometry.</desc>
<rect width="960" height="560" fill="#F4F0E5"/>
<g font-family="system-ui, sans-serif">
<text x="40" y="64" font-size="36" fill="#172530">Support beneath a surface</text>
<text x="40" y="107" font-size="22" fill="#172530">Documentary reference · original conceptual illustration</text>
<rect x="60" y="150" width="600" height="110" rx="16" fill="#E4E8E5" stroke="#172530" stroke-width="3"/><text x="90" y="212" font-size="28" fill="#172530">Sandstone above</text><rect x="60" y="285" width="400" height="100" rx="16" fill="#E4E8E5" stroke="#172530" stroke-width="3"/><text x="90" y="345" font-size="28" fill="#172530">Shale beneath</text><path d="M 475 335 H 630" stroke="#172530" stroke-width="4"/><path d="M 615 325 L 630 335 L 615 345" fill="none" stroke="#172530" stroke-width="4"/><text x="665" y="326" font-size="25" fill="#172530">Erosion removes</text><text x="665" y="362" font-size="25" fill="#172530">support.</text><text x="60" y="440" font-size="29" fill="#172530">Unsupported sandstone can then break away.</text>
<text x="40" y="505" font-size="22" fill="#172530">Conceptual, not a survey, photograph or sign transcription.</text>
<text x="40" y="538" font-size="22" fill="#172530">Complete readable text is supplied beside this figure.</text>
</g></svg>
