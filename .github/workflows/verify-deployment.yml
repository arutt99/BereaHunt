name: Verify live Pages game

on:
  workflow_dispatch:
  workflow_run:
    workflows: [Deploy game to Pages]
    types: [completed]
    branches: [main]

permissions:
  contents: read

concurrency:
  group: live-pages-main
  cancel-in-progress: true

jobs:
  playthrough:
    name: Play the deployed case end to end
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || 'main' }}
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install Playwright Chromium
        run: |
          npm install --no-save playwright@1.58.0
          npx playwright install --with-deps chromium
      - name: Play the live game (light and dark, offline relaunch)
        env:
          BASE_URL: https://arutt99.github.io/BereaHunt/
        run: node tests/playthrough.cjs
