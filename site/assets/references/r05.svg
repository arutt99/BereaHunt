<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" role="img" aria-labelledby="title desc">
<title id="title">A material with several uses</title>
<desc id="desc">Berea sandstone has been used as tool-sharpening grindstones and as building stone. The material name alone does not establish an individual object’s manufacture date or owner.</desc>
<rect width="960" height="560" fill="#F4F0E5"/>
<g font-family="system-ui, sans-serif">
<text x="40" y="64" font-size="36" fill="#172530">A material with several uses</text>
<text x="40" y="107" font-size="22" fill="#172530">Documentary reference · original conceptual illustration</text>
<rect x="45" y="165" width="410" height="200" rx="16" fill="#E4E8E5" stroke="#172530" stroke-width="3"/><text x="75" y="225" font-size="32" fill="#172530">Grindstones</text><text x="75" y="282" font-size="28" fill="#172530">Tool sharpening</text><rect x="495" y="165" width="420" height="200" rx="16" fill="#E4E8E5" stroke="#172530" stroke-width="3"/><text x="525" y="225" font-size="32" fill="#172530">Building stone</text><text x="525" y="282" font-size="28" fill="#172530">Construction</text><text x="75" y="424" font-size="28" fill="#172530">Material use alone does not date an individual object.</text>
<text x="40" y="505" font-size="22" fill="#172530">Conceptual, not a survey, photograph or sign transcription.</text>
<text x="40" y="538" font-size="22" fill="#172530">Complete readable text is supplied beside this figure.</text>
</g></svg>
