name: Verify live Pages game

on:
  pull_request:
    branches: [main]
    paths:
      - .github/workflows/verify-deployment.yml
      - scripts/test_browser.py
      - docs/deployment.md
      - docs/testing/readiness.md
  workflow_dispatch:
  workflow_run:
    workflows: [Deploy game to Pages]
    types: [completed]
    branches: [main]

permissions:
  contents: read

concurrency:
  group: live-pages-${{ github.event_name == 'pull_request' && github.event.pull_request.number || 'main' }}
  cancel-in-progress: false

jobs:
  smoke:
    name: Check deployed game and offline completion
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout verification tools
        uses: actions/checkout@v4

      - name: Checkout expected deployed revision
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || 'main' }}
          path: deployed-source
          persist-credentials: false

      - name: Record expected revision
        working-directory: deployed-source
        run: git rev-parse HEAD

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install browser test dependencies
        run: |
          python -m pip install playwright==1.58.0
          python -m playwright install --with-deps chromium

      - name: Verify live Pages game
        run: >-
          python scripts/test_browser.py
          --chromium "$(python -c 'from playwright.sync_api import sync_playwright; p=sync_playwright().start(); print(p.chromium.executable_path); p.stop()')"
          --live-url https://arutt99.github.io/BereaHunt/
          --expected-site deployed-source/site
