<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" role="img" aria-labelledby="title desc">
<title id="title">Origin and later setting</title>
<desc id="desc">The City of Berea reports a bell from the former City Hall at East Bridge and Seminary reinstalled in McKelvey Park. The park was dedicated on 27 September 1985 and rededicated on 27 September 2015. These dates do not date the private panels.</desc>
<rect width="960" height="560" fill="#F4F0E5"/>
<g font-family="system-ui, sans-serif">
<text x="40" y="64" font-size="36" fill="#172530">Origin and later setting</text>
<text x="40" y="107" font-size="22" fill="#172530">Documentary reference · original conceptual illustration</text>
<rect x="45" y="150" width="870" height="115" rx="16" fill="#E4E8E5" stroke="#172530" stroke-width="3"/><text x="70" y="194" font-size="28" fill="#172530">Bell from former City Hall</text><text x="70" y="234" font-size="26" fill="#172530">East Bridge and Seminary → reinstalled in park</text><rect x="45" y="300" width="410" height="140" rx="16" fill="#E4E8E5" stroke="#172530" stroke-width="3"/><text x="70" y="344" font-size="26" fill="#172530">Park dedication</text><text x="70" y="393" font-size="28" fill="#172530">27 September 1985</text><rect x="495" y="300" width="420" height="140" rx="16" fill="#E4E8E5" stroke="#172530" stroke-width="3"/><text x="520" y="344" font-size="26" fill="#172530">Park rededication</text><text x="520" y="393" font-size="28" fill="#172530">27 September 2015</text>
<text x="40" y="505" font-size="22" fill="#172530">Conceptual, not a survey, photograph or sign transcription.</text>
<text x="40" y="538" font-size="22" fill="#172530">Complete readable text is supplied beside this figure.</text>
</g></svg>
